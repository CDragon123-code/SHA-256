# Pin order for Caravel user_project_wrapper
# Pins are placed on the 4 sides of the user project area
# Format: N/S/E/W | pin_name | metal_layer

# North side — Wishbone data bus
#N wbs_dat_o[0]  met3
#N wbs_dat_o[1]  met3
#N wbs_dat_o[2]  met3
#N wbs_dat_o[3]  met3

# East side — Wishbone address/control
#E wbs_adr_i[0]  met2
#E wbs_adr_i[1]  met2
#E wb_clk_i      met2
#E wb_rst_i      met2
#E wbs_cyc_i     met2
#E wbs_stb_i     met2
#E wbs_we_i      met2
#E wbs_ack_o     met2

# South side — Logic analyzer
#S la_data_in[0]  met2

# West side — GPIO
#W io[0]  met2

# NOTE: The actual pin order depends on the Caravel pad frame version.
# Run `make pin_order` in caravel_user_project to generate the correct order,
# then manually place SHA256-specific pins on available metal layers.
